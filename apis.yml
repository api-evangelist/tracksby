name: Tracksby
description: Tracksby (Tracks.by) was a music marketing startup that helped artists
  and their managers release new music and videos through deep Facebook integration,
  social launch campaigns, fan email capture, and YouTube/VEVO embeds, turning each
  release into a fan-growth campaign. Listed on the a16z investment list, the early-2010s
  company is now defunct - tracks.by no longer resolves, tracksby.com is parked for
  sale, the @TracksBy Twitter account is gone, and its GitHub account has been inactive
  since 2012. No public API surface was found, so this profile records an inactive
  portfolio lead with no artifacts to enrich.
